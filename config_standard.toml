note = "7 Jeweller's Orbs each"

[vendor_recipes.gemcutter]
# Gemcutter's Prism: gems with 40% total quality (or one 20%). Priced gem variants (emit_gems),
# 20% and Awakened gems (rules/top.filter) keep their own rules. conds Quality >= 1 = every
