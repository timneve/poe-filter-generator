# Price filter config. Edit, then run:  python build_filter.py

# ===========================================================================
# PRICE TIERS. Everything else in this file points at these by name
# (min_tier = "mid", never_hide_tier = "top", ...), so they all move together.
# Style for each tier is in [style.<name>] at the bottom.
# ===========================================================================
# Every threshold is a fraction of 1 divine (poe.ninja rate), so tiers move with the economy.
# Item worth >= threshold gets that tier. dust = 0: everything priced below brown.
tiers.top   = 1                # TINK: 1 div
tiers.high  = 0.25             # 1/4 div
tiers.mid   = 0.0625           # 1/16 div
tiers.minor = 0.015625         # 1/64 div  (~6c at 400c div)
tiers.low   = 0.00390625       # 1/256 div (~1.5c at 400c div)
tiers.brown = 0.0009765625     # 1/1024 div (~0.4c at 400c div)
tiers.dust  = 0                # everything below brown
# Where blue "variable" (unknown / gamble value) ranks: right after this tier. Order is then
# top, high, mid, minor, variable, low, brown, dust: a known minor+ price beats "maybe" (vendor
# recipe floors, tier comparisons). Jackpot / never-hide rules don't depend on it.
variable_after = "minor"

# Per-tier switches. List tier names (top, high, mid, minor, low, brown, dust, variable, unknown).
# hide_tiers:  priced but hidden. Remove one to start showing it
#              (e.g. drop "brown" early league when 1/1024 div stuff is worth picking up).
# quiet_tiers: unintrusive brown instead of the tier's own style: brown text, grey beam,
#              grey icon, no sound (keeps the tier's font size). Style in [style.quiet].
#              e.g. late league: quiet_tiers = ["low"], later ["low", "mid"].
hide_tiers = ["brown", "dust"]
quiet_tiers = ["low"]

# ENDGAME RARES: module rares (rules/modules/rares.filter = NeverSink [[1700]]-[2201], [2602], [[2700]]).
# rares.enabled = whole module: decorators (bigger text in rares.text_color on ilvl 68+ rares), talismans, veiled
# + breach rings shown, conditional hides (corrupted / mirrored unID, your FilterBlade entry hiding
# ilvl < 83 two-handers / bows / staves / body armours), droplevel hides, animated-weapon Shows (off;
# league_start leaves them off: they'd show every normal / magic weapon), hide layer (league_start:
# every Hide off, so base_tiers "all" decides). Each of those
# blocks: on / off in modules.toml [rares.blocks]. Runs after crafting bases / uniques / id mods,
# so a priced base, jackpot or good identified rare is never hidden by it.
# Base-tier Shows (modules.toml keys "rr...tN" = "config.toml [rares]") are set ONLY here, not in
# modules.toml: rares.base_tiers = on / off (league_start: on, every group "all", min_ilvl 68) (ilvl rares.min_ilvl.<group>+,
# at least 68). poe.ninja has no rare prices, so these use NeverSink's FilterBlade base tiers.
# Per group, list the tiers to show:
# "t1" (best bases) .. "t5" (weapons + armour; jewellery t1..t3), "all" = every base, [] = none.
# League start: ["all"], then tighten: ["t1", "t2", "t3"] -> ["t1", "t2"] -> ["t1"] -> [].
# Shown rares get muted rare-yellow text (rares.text_color = a [colors] name; game yellow = "255 255 119 255";
# kept pale + cool so it reads apart from the orange-gold mid tier and the tan brown tier),
# no sound / beam / icon; the rest stay hidden. Price rules (crafting bases, links) still win.
rares.enabled = true
rares.base_tiers = false
rares.weapons = ["t1"]
rares.armour = ["t1"]
rares.jewellery = ["t1"]     # amulets, rings, belts
rares.text_color = "rare"
# Per group: only rares at this item level or higher (68 = all endgame).
rares.min_ilvl.weapons = 75
rares.min_ilvl.armour = 75
rares.min_ilvl.jewellery = 75
# Per item class: false = never show that rare class, whatever its tier.
# weapons
rares.show."Bows" = true
rares.show."Claws" = true
rares.show."Daggers" = true
rares.show."One Hand Axes" = true
rares.show."One Hand Maces" = true
rares.show."One Hand Swords" = true
rares.show."Quivers" = true
rares.show."Rune Daggers" = true
rares.show."Sceptres" = true
rares.show."Staves" = true
rares.show."Thrusting One Hand Swords" = true
rares.show."Two Hand Axes" = true
rares.show."Two Hand Maces" = true
rares.show."Two Hand Swords" = true
rares.show."Wands" = true
rares.show."Warstaves" = true
# armour
rares.show."Body Armours" = true
rares.show."Boots" = true
rares.show."Gloves" = true
rares.show."Helmets" = true
rares.show."Shields" = true
# jewellery
rares.show."Amulets" = true
rares.show."Belts" = true
rares.show."Rings" = true

# JACKPOT: ANY item worth >= this many divines is never hidden. Where the filter can only
# see a group (a unique base, a Foulborn base, a 5L unique base, a crafting base ilvl range)
# and the cheap stuff in that group is junk, the group goes blue "variable" instead.
# Single priced stackables >= this are already top tier. Change freely.
jackpot_divine = 13

# ===========================================================================

# "auto" = current challenge league from poe.ninja (softcore, trade). Or a name from
# leagues.toml (every build rewrites it from poe.ninja: current / not-yet-priced / old leagues).
league = "auto"

# Filter file name (without .filter) and where to write it
output_name = "pricefilter"
output_dirs = ["~/Documents/My Games/Path of Exile"]

# Hide Forbidden Tome regardless of its price or fallback class rule. false = shown: overrides
# the [maps] module's Sanctum Research Hides (modules.toml "exoticmap->sanctum.*").
hide_forbidden_tome = true

# Heist contracts (any rarity, also unique). false = all hidden, before any price rule.
# true = all shown: overrides the [maps] module's plain-contract Hide
# (modules.toml "heist->contract.handpicked"). Quest contracts (Quest Items) always shown.
show_contracts = false

# Show generic 5-link / 6-link items.
show_5_links = false
show_6_links = false
show_mirrored = false

# Vendor recipes: see [vendor_recipes.*] further down.

# Gold: false = always hidden. true = in maps (area level 68+) stacks >= gold_min_stack shown
# (FilterBlade's big-gold look), smaller ones hidden; every stack in the campaign.
# gold_min_stack alone decides the big look (modules.toml gold.* keys follow it).
# show_small_gold: true = smaller stacks also shown in maps, in the small campaign-gold look.
# League start: show_gold + show_small_gold true (all gold, big stacks still big).
show_gold = false
gold_min_stack = 10000
show_small_gold = false

# Item classes always shown at top tier (tink), priced or not, never hidden: first block, beats
# prices, [overrides] and modules (like the pinned Divine / Mirror / Hinekora's Lock).
# "Vault Keys" = every Reliquary Key (modules.toml maps relickeys* follow this).
always_top_classes = ["Vault Keys"]

# Re-download prices if cache older than this many minutes
cache_minutes = 60

# LEAGUE START: true = show (almost) everything while prices are thin and you're poor.
# Better for tightening step by step: python tools/league_start.py start (writes these same
# values INTO config.toml / modules.toml, backup kept; guide: docs/LEAGUE_START.md).
# This flag overrides the settings below at build time without editing them (one line back):
#   hide_tiers -> none (brown, dust shown)      small_loot -> off
#   uniques.show -> all tiers    foulborn / bases / gems min_tier -> lowest tier
#   uniques.hide_maps -> false   uniques.variable_jackpot_only -> false
#   "hide" in overrides, unpriced settings, card tiers, [exchange.unpriced_tiers] -> lowest tier
#   show_5_links / show_6_links / show_mirrored / show_contracts / show_gold / show_small_gold
#   -> true, hide_forbidden_tome -> false, [gems] show_all on, every [overquality] on
#   every [content.*] module (false drops -> "price"), [vendor_recipes.*] and rule module
#   (enabled) on, [leveling] on
#   [maps] progression "none" -> "all", corrupted_min_tier -> 0
#   [rares] base_tiers on, every group ["all"], min_ilvl 68
#   modules.toml: every off Show block on, except [[2600]] animated weapons, [2805] empty
#   cluster eco tiers, [2302] crafting matrix (they'd flood); every on Hide block off, except
#   maps [3302] tier Hides (progression "all" shows them in tier style) and leveling (campaign
#   preset: outdated-flask Hides)
#   [leveling] unused_whites_min_tier -> your bases.min_tier (league_start_hide_unused): white
#   crafting bases the [leveling] build never uses stay hidden
# Not changed: [leveling] campaign hides (hide_normal_after, hide_magic_after, strictness).
# Only plain gear in maps stays hidden.
# Set back to false after a few days, when you have currency and prices settle.
league_start = false

# ---------------------------------------------------------------------------
# COLOURS. The only place colour values live. Everything else (styles below, rules/*.filter,
# the code) uses these names: "SetTextColor white", gear_text_color = "white".
# Blocks copied from reference/league.filter (clusters, flasks, exotics, maps, leveling rules)
# snap to the nearest colour here, so their whites / reds / yellows look like ours.
# Exception: hidden gear's Alt view keeps the game's rarity colours.
# ---------------------------------------------------------------------------
colors.white = "215 215 215 255"     # minor / low tiers, gear text, every imported white
colors.grey = "170 170 170 255"      # campaign white gear
colors.red = "255 0 0 255"           # top (tink) + high tier text, tink border
colors.yellow = "255 190 0 255"      # mid tier
colors.brown = "210 178 134 255"     # brown / dust / quiet tiers
colors.gold = "255 212 87 255"       # gold piles
colors.cyan = "20 240 240 255"       # quality gems
colors.rare = "235 220 105 255"      # endgame rares (rares.text_color)
colors.tink_bg = "255 255 255 255"   # tink background (top tier only)
colors.content_bg = "0 0 0 193"      # [style.content] label background
colors.clear = "0 0 0 0"             # no border / background

# Text colour for normal/magic/rare gear, so rarity (yellow/blue) never grabs the eye.
# A [colors] name. "white" now; when rich switch to "brown" (less clicking, less distraction).
# Price tier styles still win (a 1 div base keeps its red tink text).
# Maps only: in the campaign ([leveling] on, AreaLevel <= area_level_max) gear keeps rarity colour.
gear_text_color = "white"
# Campaign only: white (normal) gear text, a bit grey so it reads below magic / rare.
campaign_white_text_color = "grey"

# Unknown value -> blue. A unique base only gets a price tier when EVERY unique that can
# drop on it (poewiki list, boss-only ones too) has a confident poe.ninja price. One
# unique with thin / no listings makes the whole base blue "variable": worth a look,
# value not known. false = tier by the priced uniques only.
unknown_as_variable = true

# ---------------------------------------------------------------------------
# Stackable stuff priced from the Currency Exchange (currency, cards, scarabs,
# essences, fossils, oils, omens, tattoos, fragments, ...)
# ---------------------------------------------------------------------------
[exchange]
# Ignore non-card prices with less trade volume than this (chaos). Divination-card
# exchange data has no buy/sell direction, so card quotes are not used at any volume.
min_volume = 5
# Use the NeverSink card group only when there is no reliable card/reward price AND this
# exchange volume is below the threshold. volumePrimaryValue is a chaos-equivalent activity
# proxy, not a count of trades. At/above the threshold cards without a reliable price stay
# unknown (blue, silent), rather than inheriting a potentially misleading reference tier.
card_fallback_min_volume = 5
# Unpriced card whose fallback group (fallback_tiers.toml cards) is hidden: a stack of at least
# this many still shows, in fallback_stack_tier (league.filter "exstack"; 0 = off). Cards with a
# card_rewards price: their price decides stacks too.
card_fallback_stack = 3
# Tier for those fallback stack Shows (cards above, [exchange.reference_currency_stacks]).
fallback_stack_tier = "low"
# Tier for [exchange.show_stacks] (stacks shown whatever their price).
show_stacks_tier = "low"
# Also show stacks: 10x a 0.5c item = 5c, tiered as 5c. Stack checks up to:
max_stack = 40
# (per-name bigger limit for items that drop in huge stacks: [exchange.big_stacks])
# Low-volume prices for non-card stackables are still used to SHOW an item, never to hide it.
# What to do with stackables poe.ninja has no price for: a tier name, "hide" or "unknown"
# "reference" = NeverSink currency tier from fallback_tiers.toml [currency] (mapping below), so
# league start (no poe.ninja prices yet) still has sane tiers; not in reference -> "unknown".
unpriced_currency = "reference"
# Card quotes are not used to assign a value. Cards with explicitly configured, guaranteed
# rewards use exact reward value / set size. Other unpriced cards use regular NeverSink's
# divination-card groups as a fallback; unmatched cards stay unknown (blue beam, no sound).
# NeverSink groups are not treated as market prices.

# Fixed tier for known-cheap stackables when poe.ninja has no confident price (also thin-volume
# cheap quotes). Beats unpriced_currency / reference. A confident price or [overrides] still wins.
# e.g. "Some Cheap Oil" = "dust". Hard-to-price oils (Clear / Sepia) are pinned in [overrides].
[exchange.unpriced_tiers]
"Scroll Fragment" = "hide"   # NeverSink hides them
"Amber Oil" = "hide"         # league.filter (FilterBlade) hides these cheap oils
"Verdant Oil" = "hide"
# Thin / no poe.ninja price, NeverSink's fallback group would hide them, but the FilterBlade
# filter shows them: unconfident + maybe valuable -> blue
"Omen of Refreshment" = "variable"
"Omen of the Soul Devourer" = "variable"

# Shards / splinters that combine into one item: price = finished item / count. Stack checks
# go up to the conversion count (a full currency-shard stack is 20).
# Skipped when the finished item has no price. name = ["finished item", count]
[exchange.splinters]
"Alchemy Shard" = ["Orb of Alchemy", 20]
"Alteration Shard" = ["Orb of Alteration", 20]
"Fracturing Shard" = ["Fracturing Orb", 20]
"Mirror Shard" = ["Mirror of Kalandra", 20]
"Transmutation Shard" = ["Orb of Transmutation", 20]
"Timeless Karui Splinter" = ["Timeless Karui Emblem", 100]
"Timeless Maraketh Splinter" = ["Timeless Maraketh Emblem", 100]
"Timeless Templar Splinter" = ["Timeless Templar Emblem", 100]
"Timeless Eternal Empire Splinter" = ["Timeless Eternal Emblem", 100]
"Timeless Vaal Splinter" = ["Timeless Vaal Emblem", 100]
"Splinter of Xoph" = ["Xoph's Breachstone", 100]
"Splinter of Tul" = ["Tul's Breachstone", 100]
"Splinter of Esh" = ["Esh's Breachstone", 100]
"Splinter of Uul-Netol" = ["Uul-Netol's Breachstone", 100]
"Splinter of Chayula" = ["Chayula's Breachstone", 100]
"Simulacrum Splinter" = ["Simulacrum", 300]
"Ritual Splinter" = ["Ritual Vessel", 100]

# Guaranteed, deterministic rewards: card = (exact reward item's price * quantity) / set size.
# Stackable rewards use their exact poe.ninja Currency Exchange item price (including fragments,
# scarabs, and other listed categories); named uniques/maps use listings for that exact item,
# weighted by listing count and requiring uniques.min_listings; 5/6-link lines are ignored (cards
# give unlinked items, linked lines are thin/troll-priced). Card rewards can chain through
# another configured exact card reward. Missing/insufficient reward prices leave the card unpriced.
# Random, selectable, corrupted, variable-outcome, and generic-category rewards are intentionally
# excluded. Divination-card quotes never price a card because the feed does not distinguish buy
# orders from sell quotes. Exact reward values override card quotes.
