# ---------------------------------------------------------------------------
# Foulborn uniques: priced on their own, never mixed into the normal unique tiers.
# One Foulborn unique has many mutated-mod variants (Doomsower 120c .. 263k c) and the
# filter can't see which mods dropped, only "Foulborn True" + BaseType. So per base:
#   tier     = cheapest variant of any Foulborn unique on it (Goldwyrm 3.5c -> low)
#   variable = best variant >= [foulborn] jackpot_divine (worth checking the mods);
#              a cheapest already top / high / mid keeps that louder tier
#   hidden   = below min_tier (and below [small_loot] when that's on), unless some
#              variant >= uniques.never_hide_tier (then variable)
# min_listings counts all variants of one unique together (variants are thin).
# A Foulborn only takes its own price: normal unique tiers have "Foulborn False", so a
# 5c Foulborn on a base whose normal unique is 780c is not shown at the normal tier.
# ---------------------------------------------------------------------------
[foulborn]
# Own jackpot (divines), separate from the top-level jackpot_divine: Foulborn come from
# Wombgifts only, never random map drops, so there are few and checking mods is cheap.
# Best variant >= this -> blue "variable", never hidden.
jackpot_divine = 0.5
min_listings = 5
min_tier = "low"
# Foulborn base with no confident price: tier name, "hide" or "unknown"
unpriced = "unknown"

# ---------------------------------------------------------------------------
# Wrist saver: loot that doesn't stack (takes its own inventory slot) worth less than
# tier min_tier is hidden, to cut clicking and inventory management. Applies to uniques,
# Foulborn uniques and the poe.ninja types in `types`. Jackpots and never_hide_tier still
# show. enabled = false -> only each section's own min_tier applies.
# ---------------------------------------------------------------------------
[small_loot]
enabled = true
min_tier = "minor"
types = ["Invitation", "Wombgift"]

# ---------------------------------------------------------------------------
# Gems: a poe.ninja variant price (1, 1/20, 20/20, 21/23c ...) shows the gem in its tier only
# from min_tier up (level 1 gems list at 5-10c that nobody pays). Cheaper gems: hidden by
# rules/bottom.filter, except rules/top.filter's Awakened / 20% shows and the gemcutter
# recipe (like NeverSink, which hides plain level 1 gems). league_start: lowest tier.
# No exact price -> blue (variable): thin listings except plain, uncorrupted level 1-19 / 0-quality
# vendor gems (hidden as worthless), and level 21+ / quality 21+ gems with no confident price.
# Confident prices below min_tier still hide that variant.
# A variant's price is capped by a confident better variant (20/0 never above 20/20).
# A gem poe.ninja doesn't list at all (new exceptional supports): blue. Cheap level 18-20 gems are
# left to price (FilterBlade shows every one; your choice).
# show_all: true = every gem shown (rules/bottom.filter's "Hide # gems.show_all" gem Hide turns
# Show, no "known on poe.ninja" gem Hide); priced gems keep their tier. League start: true.
# ---------------------------------------------------------------------------
[gems]
min_tier = "mid"
show_all = false

# ---------------------------------------------------------------------------
# Overquality: every quality-threshold rule in one place (modules.toml value
# "config.toml [overquality]" = decided here). Non-mirrored, non-corrupted unless noted.
# true = shown with league.filter's look, false = no rule (the item falls to the normal rules,
# e.g. hidden by the endgame hide layer).
#
# Any normal / magic / rare gear (module gear_special [0901]; works with [gear_special] off too).
# 30% = our top-tier tink style, placed before the base rules below so any 30% item tinks.
# After [id_mods], before [exotics] / vendor recipes (a 30% RGB item keeps this alert).
#
# Top bases (module gear_special [0901] "perfection", normal / magic / rare; need
# [gear_special] enabled): t1 armour = best ES / armour / evasion body / boots / gloves /
# helmet / shield bases, t1 / t2 weapon = best / good weapon bases ilvl 83+, chancing = Riveted
# Boots / Steel Kite Shield.
#
# Flasks / tinctures (module flasks [[2500]], normal / magic, ilvl 82+ in maps; need [flasks]
# enabled): any_flask_21 = any flask / tincture class; utility_flasks_26 = ilvl 84+ any utility flask; utility_corrupted_30 = corrupted
# magic utility flask; life_mana = Divine / Eternal life / mana, Hallowed Hybrid.
#
# Uniques (module unique_exceptions [4804]): shown blue on a base the price rules hide (a base
# priced in a shown tier keeps its price look). league.filter: 27%. Needs [unique_exceptions].
#
# league_start: every key on.
# ---------------------------------------------------------------------------
[overquality]
# any gear
quality_30 = true
quality_27 = false
quality_21 = false
# top bases
armour_t1_28 = true
armour_t1_21 = false
weapon_t1_28 = true
weapon_t1_24 = true
weapon_t2_28 = false
weapon_t2_24 = false
chancing_bases_28 = true
# flasks / tinctures
any_flask_21 = false
tinctures_26 = true
tinctures_21 = true
utility_flasks_26 = true
utility_flasks_21 = true
utility_corrupted_30 = true
life_mana_flasks_30 = true
life_mana_flasks_21 = false
# uniques
uniques_21 = true

# ---------------------------------------------------------------------------
# Influenced / eldritch / exotic bases + perfection: our module rules/modules/gear_special.filter
# (made from FilterBlade's rules, league.filter style without borders / backgrounds). Per-block
# on / off: modules.toml [gear_special.blocks]. Families:
#   [0302] influenced rares: t1 exclusive bases (any influence), t1 bases per influence ilvl 82+;
#          off: top bases, t2 classes per influence, t2 bases 84+, any influenced 86+ / any
#   [[0400]] eldritch (Searing Exarch / Eater of Worlds implicit): all off (top armour bases / any)
#   [[0500]] exotic bases: Iron Flask, heist / ritual / Kalandra / talisman bases, Grasping Mail,
#            unique-only bases, Cord Belt, Stygian Vise (abyssal / ilvl 86), Sacrificial Garb,
#            Pearlescent Amulet; off: expedition (runic) bases, any Stygian Vise
#   [0901] perfection: BaseDefencePercentile 99 ilvl 84+ (off); every quality block (top armour /
#          weapon / chancing bases, any-gear overquality): [overquality]
# FilterBlade's [[0500]] "Conditional Entry" blocks are no module blocks: Stacked Deck = stackable
# price, breach rings = [vendor_recipes.grasping_mail], unique Opal Ring / Abyssal Axe = unique price.
# A base poe.ninja prices at a shown [bases] tier (or jackpot -> blue) keeps that price style;
# one priced lower is not decided by price, so these Shows apply. Uniques never match.
# league_start: every gear_special Show on (and every [overquality] key).
# [0901] after [id_mods], before [exotics]; [0302]-[[0500]] after [exotics] and the priced bases
# (identified good mods, fractured / strand look and a base price win), before vendor recipes.
# enabled = false: every block off, incl. the [overquality] top-base keys; the 3 any-gear
# [overquality] quality_* keys stay (own option).
# ---------------------------------------------------------------------------
[gear_special]
enabled = true

# ---------------------------------------------------------------------------
# Linked gear, endgame crafting, chancing bases: our module rules/modules/crafting.filter (made
# from FilterBlade's rules, league.filter style). Per-block on / off: modules.toml [crafting.blocks].
#   [1401] 5-links: leveling (area level <= 67), 5L 6S, endgame 5L - all off (generic tink
#          5 / 6 links: show_5_links / show_6_links). RGB / 6-socket blocks = vendor recipes:
#          [vendor_recipes.chromatic] / [vendor_recipes.jeweller] (tier floor), no module block.
#   [2301] early endgame crafting (Amethyst / Two-Stone Ring, Kinetic Wand, area 68-75: on;
#          4-link armour: off)
#   [2302] crafting matrix: ilvl 83 / 84 / 85 / 86 bases in 3 tiers, all off (poe.ninja prices
#          bases first: [bases])
#   [[2400]] chancing bases (Heavy / Leather Belt, Champion Kite Shield): off
#   [2601] RGB: [vendor_recipes.chromatic] ([[2600]] animated weapons: [rares])
# league_start: every Show on except [2302] (has an empty "every ilvl 83+ base" tier).
# [1401] after [exotics], before vendor recipes; [[2300]]-[2601] after the [rares] gear tiers,
# before the rare hide layer.
# ---------------------------------------------------------------------------
[crafting]
enabled = true

# ---------------------------------------------------------------------------
# Normal / magic flasks + tinctures: our module rules/modules/flasks.filter (made from
# FilterBlade's rules, league.filter style without borders / backgrounds): identified magic
# flasks / tinctures with good mods ([0803]), fractured utility flasks ([1303]), endgame
# [[2500]] (ilvl 82-85 utility / tinctures, early-mapping 1% / 10% quality flasks: off).
# Overquality flask / tincture blocks: config.toml [overquality] (need this enabled).
# Per-block on / off: modules.toml [flasks.blocks]. Before vendor recipes, so a 21% white
# flask shows this way instead of the glassblower style.
# Flask bases (Iron Flask ilvl 84 ...) are priced by poe.ninja in [bases], not here.
# league_start: every flask block on (also the ones off in modules.toml).
# ---------------------------------------------------------------------------
[flasks]
enabled = true

# ---------------------------------------------------------------------------
# Exotic gear: our module rules/modules/exotics.filter (made from FilterBlade's rules,
# league.filter style without borders / backgrounds). Per-block on / off: modules.toml
# [exotics.blocks]. Families:
#   [0902] memory strands (stranded + fractured / veiled, top bases 60+ / 15+ strands)
#   [[1100]] exotic mods: veiled, incursion (temple), necropolis (Haunted), bestiary (Farrul /
#            Fenumus ...), delve, mercenary (Infamous), warband, essence; crafted: off
#   [[1200]] exotic classes: imbued, synthesised, voidstones, trinkets, fishing rods, unique
#            pieces, quest items; [1201] normal / magic / rare relics
#   [[1300]] variations: double / single corrupted rares, abyss-socketed gear, fractured
#            jewels / heist gear (fractured flasks: [flasks]), enchanted / anointed, crucible
# Uniques (unique fishing rods, imbued uniques, unique relics) stay priced by [uniques].
# league_start: every exotic block on (lower strand tiers, any fractured item ...).
# After [id_mods], before vendor recipes / crafting bases / rares. poe.ninja has no price for these.
# ---------------------------------------------------------------------------
[exotics]
enabled = true

# ---------------------------------------------------------------------------
# Identified gear with good mods: reference/league.filter's ID-mod blocks with its own style
# (borders / backgrounds stripped): [[0600]] mod combinations per slot (phys / ele / caster
# weapons, each armour slot, jewellery, quivers, jewels, veiled exceptions), [[0700]] dual
# mods, [0801] top-value + [0802] uncorrupted single mods, [[1000]] corrupted items with good
# mods. Flask / tincture ID mods ([0803]): [flasks]. league_start: also commented-out blocks.
# Before vendor recipes / crafting bases / rares: a good identified rare is never hidden.
# ---------------------------------------------------------------------------
[id_mods]
enabled = true

# ---------------------------------------------------------------------------
# Maps + map items: our module rules/modules/maps.filter (from the FilterBlade filter, its
# own style; every block on / off in modules.toml [maps.blocks]). Special maps: Valdo,
# Nightmare, Shaper guardian, Zana / Elder (T16) / conqueror influenced, blighted +
# blight-ravaged, T16 Vaal Temple, enchanted, implicit, 8-mod corrupted ([0301], [3202]-[3204]).
# Unique maps: [uniques] hide_maps. Map items ([[3400]] / [[3500]]): unique contracts /
# blueprints, logbooks, charts, enchanted contracts / blueprints, blueprints shown, plain
# contracts + Sanctum Research (Forbidden Tome) hidden, reliquary keys / Chronicle / Inscribed
# Ultimatum shown. A poe.ninja price (Voidborn Reliquary Key) or the unpriced fragment fallback
# (blue) decides first; show_contracts / hide_forbidden_tome beat these blocks both ways
# (false / true: hidden before all; true / false: the module's contract / tome Hides skipped).
# enabled = false: no map / map item rules at all (hide_maps, progression, corrupted_min_tier
#   do nothing; maps fall to unique prices / the blue safety net).
# progression = normal maps by tier ([3302]):
#   "none" = league.filter as is: every tier hidden (late league)
#   "all"  = every tier shown, league.filter tier style (league start: turning the rules on)
#   "auto" = a tier shows while AreaLevel <= its own level (campaign: all; in a T5 map: T5+;
#            in a T16 map: T16 only). Middle ground while climbing the atlas.
# league_start: "none" -> "all", corrupted_min_tier 0, every Show block of the module on
# (corrupted implicit), every Hide off except the [3302] tier Hides (progression shows them).
# corrupted_min_tier: non-unique corrupted maps below this tier hidden (8-mod, implicit, blighted,
#   influenced, progression tiers too). Valdo / Nightmare / Shaper guardian and unique maps
#   untouched. 0 = off.
# ---------------------------------------------------------------------------
[maps]
enabled = true
progression = "none"
corrupted_min_tier = 16

# ---------------------------------------------------------------------------
# Jewels: our module rules/modules/jewels.filter (from the FilterBlade filter, its own style;
# every block on / off in modules.toml [jewels.blocks]): [2801] corrupted-implicit rare / magic
# jewels + uncorrupted ones with a top mod, [2803] abyss jewels (corrupted rare, ilvl 83+ / 86+
# shown, rest hidden), [2804] other rare / magic jewels hidden, [2805] cluster jewels by
# enchant x passives x ilvl, [2806] random clusters (optimal passive counts ilvl 84 shown, rest
# hidden). Priced first, so they win: poe.ninja cluster prices ([2805] only adds unpriced ones),
# priced jewel bases ([bases]), [id_mods] / [exotics] jewels, campaign ([leveling]).
# league_start: every Show block on (lower abyss / random cluster tiers), except [2805]: its
# off blocks are empty economy tiers that would match every enchant; every Hide off.
# After rares, before [heist].
# ---------------------------------------------------------------------------
[jewels]
enabled = true

# ---------------------------------------------------------------------------
# Heist gear: our module rules/modules/heist.filter (from the FilterBlade filter, its own style;
# every block on / off in modules.toml [heist.blocks]): per cloak / brooch / gear / tool, top
# bases (ilvl 83+ louder), good bases shown, the rest hidden. Priced crafting bases and
# [id_mods] / [exotics] heist items decide first. Contracts / blueprints: [maps].
# ---------------------------------------------------------------------------
[heist]
enabled = true

# ---------------------------------------------------------------------------
# Misc items: our module rules/modules/misc.filter (from the FilterBlade filter, its own style;
# every block on / off in modules.toml [misc.blocks]):
#   gold.*        FilterBlade's gold stack tiers: decided by show_gold / gold_min_stack (top of
#                 this file), not by [misc] enabled or modules.toml
#   heisttarget / enshrouded / event->idols.*   heist targets, enshrouded gear, magic / rare idols
#                 (event leagues): before uniques, as in FilterBlade ("override uniques")
#   questlike.*   Maven's invitations, lab / incursion items: after uniques (prices first)
#   6l.*          FilterBlade's 6-link overrides: set by show_6_links above instead
# enabled = false: none of these (idols hidden as gear).
# ---------------------------------------------------------------------------
[misc]
enabled = true

# ---------------------------------------------------------------------------
# Campaign / leveling: our module rules/modules/leveling.filter (NeverSink's leveling rules
# from the FilterBlade filter: [2802] jewels, [[3800]] currency, [[5000]]-[[5405]] flasks,
# rares, normal / magic gear; every block on / off in modules.toml [leveling.blocks]).
# Blocks valued "config.toml [leveling] strictness" follow strictness below (their NeverSink
# tag, as FilterBlade at that strictness), [[3800]] currency styles too; true / false blocks =
# FilterBlade options (on: quicksilver / utility flask alerts; off: rare / magic size
# decorators, spirit shields; league_start turns them on, strictness blocks stay as
# strictness says). Campaign currency: a price tier that shows it (single or the stack size
# reaching a shown tier; pinned Divine / Mirror / Hinekora's Lock, [overrides]) wins over the
# [[3800]] style; never hidden (show_all_stackables).
# Every block gets "AreaLevel <= area_level_max" (and "Rarity <= Rare" on gear), so they
# do nothing in maps and never touch uniques. Placed after rules/top.filter, flask / ID-mod /
# exotic rules, vendor recipes and cluster prices, before the stackable / unique / base prices.
# strictness = NeverSink levels: 0 soft (everything), 1 regular, 2 semi-strict,
#              3 strict (+ hides large magic items), 4 very strict
# build = build module rules/leveling/<build>.filter, checked first ("" = none).
#         "rf" = Pohx RF (armour / evasion, 2H axes then RF). "minion" = SRS + zombies
#         (armour/ES hybrid; pure armour only until that slot's first armour/ES base drops; never evasion or pure ES; wands + shields; minion wands / Bone Ring / minion
#         spirit shields always shown, any rarity). New build: copy one, edit, set the name here.
# hide_normal_after: last area level where white (normal) gear shows. With a build: only the
#         types in its "Show # whites" block, other white gear is always hidden. No build: all
#         white gear. Flasks not included. Other build module Shows still win (rf: Iron Ring, 4-links).
# hide_magic_after: last area level where magic (blue) gear shows, same classes as white
#         (flasks / tinctures stay, jewellery stays with show_jewellery). Vendor items enabled
#         by show_magic_vendor still show; this hide beats the build module. Leave out = off.
# keep_build_weapons_magic: true = magic weapons the build module Shows (rf: 2H axes / maces
#         until the RF swap; minion: wands) and exact bases it Shows (minion: Bone Ring, minion
#         spirit shields) still show after hide_magic_after. false = hidden too.
# show_jewellery: amulets, rings, belts of any rarity (white too) always shown in the
#         campaign, before the build module (its Hides don't apply to them).
# show_jewels: jewels + abyss jewels of any rarity always shown in the campaign, before the
#         build module (its Hides don't apply to them).
# show_3_links_until: every 3-link (any base type, any rarity incl. white) shown up to this
#         area level, before hide_magic_after and the build module (their Hides don't apply).
#         "" = off.
# link_classes: the only classes campaign link rules (3L / 4L: show_3_links_until, build module
#         link Shows, NeverSink leveling link blocks) show; other classes (weapons, boots) with
#         links fall through to the normal rules. [] = every class.
# show_gems: all skill + support gems shown in the campaign (maps: only the bottom.filter gem rules).
# show_magic_vendor / show_rare_vendor: independently show magic / rare vendor items in the
#         campaign, before hide_magic_after and the build module (their Hides don't apply).
# show_magic_rare_cells: maximum inventory cells for those items, measured per base with its
#         Width x Height (for example, small shields show while 2x4 shields do not at 4). 0 = off.
# unused_whites_min_tier: with a build, white crafting bases in maps that the build module
#         hides (rf: pure ES, unused weapons, ...) stay hidden unless priced at this
#         tier or better ("" = off). For a lowered bases.min_tier: other white bases show.
# league_start_hide_unused: league start (flag or tools/league_start.py) sets
#         unused_whites_min_tier to your bases.min_tier. false = it doesn't.
# show_all_stackables: in the campaign no currency / card / fragment / ... is hidden.
#         Price tier styles stay; what maps would hide shows in the lowest tier's style.
# ---------------------------------------------------------------------------
[leveling]
enabled = true
strictness = 2
area_level_max = 67
build = "minion"
hide_normal_after = 2
hide_magic_after = 7
keep_build_weapons_magic = true
show_jewellery = true
show_jewels = true
show_3_links_until = 24
link_classes = ["Body Armours", "Gloves", "Helmets", "Shields"]
show_gems = true
show_magic_vendor = true
show_rare_vendor = true
show_magic_rare_cells = 4
unused_whites_min_tier = ""
league_start_hide_unused = true
show_all_stackables = true
# Campaign blocks with a minimap icon but no sound get this (Orb of Chance etc. = NeverSink single chaos sound; 4 = maps only)
icon_sound = "PlayAlertSound 2 300"

# out/report.html: "Hidden, worth a look" lists hidden items priced >= this tier
[report]
review_tier = "mid"

# ---------------------------------------------------------------------------
# Crafting bases (normal/magic/rare, ilvl 82+, optionally influenced) priced
# from poe.ninja. These prices are noisy, so confidence filters are strict.
# ---------------------------------------------------------------------------
[bases]
enabled = true
min_tier = "top"       # only show bases worth at least this tier
min_listings = 10
min_samples = 10
include_dual_influence = false

# ---------------------------------------------------------------------------
# Manual overrides by exact BaseType. Win over prices.
# Divine Orb, Mirror of Kalandra, and Hinekora's Lock are pinned to top/tink and cannot be overridden.
# ---------------------------------------------------------------------------
[overrides]
# name = tier name | "hide" | "variable" | "unknown"
"Scroll of Wisdom" = "hide"
"Portal Scroll" = "hide"
# Thin, erratic poe.ninja quotes: always white (minor), whatever the price says.
"Clear Oil" = "dust"
"Sepia Oil" = "dust"

# ---------------------------------------------------------------------------
# Unique exceptions: our module rules/modules/unique_exceptions.filter (league.filter [4801] /
# [4803] / [4804] overqual): unique variants a per-base price can't tell apart, shown even when
# their base is priced hidden: uber Impresence (Shaper + Elder Onyx Amulet), Forge swords
# (influenced Infernal Sword), Kaom's Heart (Glorious Plate, no sockets), Tabula (6L Simple
# Robe), synthesised uniques, 2-4 abyss-socket uniques, Vestigial, unique idols, double
# corrupted, crucible, 27%+ quality. A base priced in a shown tier keeps its price style.
# Per-block on / off: modules.toml [unique_exceptions.blocks] (league_start: every Show on).
# ---------------------------------------------------------------------------
[unique_exceptions]
enabled = true

# Uniques with a corrupted implicit (CorruptedMods >= 1): shown even when their base
# is priced below min_tier. Listed classes OR base types match. Change per league.
# Better tiers (e.g. a tink base) keep their own style; this only rescues hidden ones.
# Old filter list: Daggers, Rune Daggers, Wands, Boots, Gloves, Helmets, Shields,
#                  Amulets, Belts, Quivers, Rings, Jewels
[corrupted_implicits]
style = "variable"   # tier style to use
classes = ["Daggers", "Rune Daggers", "Wands", "Boots", "Gloves", "Helmets", "Shields",
           "Amulets", "Belts", "Quivers", "Rings", "Jewels"]
bases = []           # exact BaseType, e.g. "Prismatic Jewel"

# Unique bases you always want at a tier regardless of price
[unique_overrides]
# "Heavy Belt" = "variable"

# ---------------------------------------------------------------------------
# Styles. Raw filter lines. Taken from your FilterBlade filter.
# Visible item text uses maximum font size 45, except explicit content-module show overrides.
# Minimap icons: size 1 (medium) everywhere, colour = text colour. Only tink gets size 0 (big).
# Icon SHAPE is set by build_filter.py per category (shape in styles below is replaced):
#   Star = uniques + tink, Square = unique maps, Circle = currency-like stackables/cards,
#   Hexagon = fragments/scarabs, Kite = splinters (name contains "Splinter"),
#   Pentagon = cluster jewels, Diamond = bases / recipes / unknown,
#   Moon = league-specific stackables without a more fitting category.
# Rule: no SetBorderColor / SetBackgroundColor except top (tink). Borders are
# cleared for everything by a default block, so only add them on purpose.
#   top     = TINK. Only for items KNOWN to be >= 1 div. White bg, red text, tink sound.
#   high    = red text, >= 1/4 div
#   mid     = yellow text, >= 1/16 div
#   minor   = grey text, >= 1/64 div
#   low     = grey text, >= 1/256 div (late league: quiet_tiers -> brown)
#   brown   = brown text, >= 1/1024 div   dust = brown text, everything cheaper
#   variable/unknown = blue beam, game's own text colour: value unknown or variable,
#                      worth picking up / identifying
# ---------------------------------------------------------------------------
[style.top]
lines = [
  "SetFontSize 45",
  "SetTextColor red",
  "SetBorderColor red",
  "SetBackgroundColor tink_bg",
  "PlayAlertSound 6 300",
  "PlayEffect Red",
  "MinimapIcon 0 Red Star",
]

[style.high]
lines = [
  "SetFontSize 45",
  "SetTextColor red",
  "PlayAlertSound 1 300",
  "PlayEffect Red",
  "MinimapIcon 1 Red Circle",
]

[style.mid]
lines = [
  "SetFontSize 45",
  "SetTextColor yellow",
  "PlayAlertSound 2 300",
  "PlayEffect Yellow",
  "MinimapIcon 1 Yellow Circle",
]

[style.minor]
lines = [
  "SetFontSize 45",
  "SetTextColor white",
  "PlayAlertSound 2 300",
  "PlayEffect White",
  "MinimapIcon 1 White Circle",
]

[style.low]
lines = [
  "SetFontSize 45",
  "SetTextColor white",
  "PlayAlertSound 2 300",
  "PlayEffect White",
  "MinimapIcon 1 White Circle",
]

# Used instead of a tier's own style when the tier is in quiet_tiers.
# SetFontSize comes from the tier itself.
[style.quiet]
lines = [
  "SetTextColor brown",
  "PlayEffect Grey",
  "MinimapIcon 2 Grey Circle",
  "DisableDropSound True",
]

# Below 1/256 div: brown text, no beam/icon/sound
[style.brown]
lines = [
  "SetFontSize 45",
  "SetTextColor brown",
  "DisableDropSound True",
]

# Content modules: small, no beam / icon / sound; keep unique text colour and soften label
[style.content]
lines = [
  "SetFontSize 32",
  "SetBackgroundColor content_bg",
  "DisableDropSound True",
]

[style.dust]
lines = [
  "SetFontSize 45",
  "SetTextColor brown",
  "DisableDropSound True",
]

[style.variable]
lines = [
  "SetFontSize 45",
  "PlayAlertSound 2 300",
  "PlayEffect Blue",
  "MinimapIcon 1 Blue Star",
]

[style.unknown]
lines = [
  "SetFontSize 45",
  "SetTextColor white",
  "PlayAlertSound 2 300",
  "PlayEffect Blue",
  "MinimapIcon 1 Blue Star",
]
