#   "Paua Amulet", "Searching Eye Jewel", "Small Cluster Jewel", "Spine Bow", "Topaz Flask",
#   "Vaal Blade", "Vaal Claw",
# ]

# Uniques that can't drop in a normal endgame map (pinnacle/uber bosses, Breachlords, Atziri,
# Syndicate, Delve, Heist + all Replicas, Incursion temple, Lab, vendor recipes, upgrades,
# no longer drops) are left out of unique pricing, so Cane of Kulemak doesn't make
# Serpentine Staff (Sire of Shards 1c) blue. Boss loot: toggle the filter off in game.
# Source: poewiki "drop restricted" flag + drop source (cache/wiki_uniques.json, weekly).
skip_non_map_drops = true
wiki_cache_days = 7
# A drop-restricted unique still counts if its wiki drop source contains any of these
# (case-insensitive): map content where it can drop.
map_sources = [
  "Map Boss", "Rare enem", "Ritual", "Ultimatum", "Runic monsters", "mercenary",
  "AbyssTwoLeague", "ReligiousTemplar", "LeagueAzmeri", "LeagueBestiary", "LegionLeague",
  "LeagueAffliction", "AfflictionTown", "MavenHub", "Monsters/Wb", "DemonBosses",
  "LunarisSolaris", "Statue", "UnholyTrio", "Viking",
]

# Expected value per unique base. A unique drop picks a tier by tier_weights, then any
# drop-anywhere unique in that tier evenly, so one unique's chance = its tier weight /
# uniques in its tier. Tiers: unique_tiers.toml (poewiki). A unique's price = average of its
# poe.ninja variants weighted by listings (Mageblood 2-4 flasks). Unlisted = worth 0, but an
# unlisted unique of tier <= unknown_chase_tier makes the base blue (unknown_as_variable).
[uniques.ev]
enabled = true
# % per tier, poewiki pre-3.19 RegularValue estimate (natural drops). T0 is the shakiest number.
tier_weights = { "0" = 0.005, "1" = 0.036, "2" = 0.8, "3" = 10.9, "4" = 34.0, "5" = 54.3 }
default_tier = 3   # drop-anywhere unique missing from unique_tiers.toml
unknown_chase_tier = 2

# Fix the wiki guess per unique name: true = drops in maps (count it), false = skip it
[uniques.map_drop]
# "Dread Captain's Cutlass" = true
"Angler's Plait" = false   # only drops with a Corrupted Slitherpinch equipped

# ---------------------------------------------------------------------------
# Vendor recipes: show the ingredients of a recipe you do, Diamond minimap icon (like crafting
# bases), styled as `tier`. The tier is a FLOOR: an ingredient whose own price tier is better
# keeps that (a 2 div unique Fugitive Ring stays a tink, a pricey ilvl 86 crafting base or an
# [overrides] base keeps its tier, a blue variable base stays blue); a cheaper or hidden one
# gets the recipe tier. tier = a price tier or "variable" (blue: beats every price tier except
# top, so a tink stays a tink). enabled = false -> recipe off.
# Ingredients, one of:
#   bases = exact BaseTypes, any rarity (normal, magic, rare, unique), optional `class`
#   conds = filter conditions, all required (no bases = any base), optional `class` (one or a
#           list) and `rarity` (list; left out = any). Uniques are left to their own rules.
# Optional `any` = filter conditions, the item needs one of them (one block each, e.g.
# ["Corrupted True"]); left out = any state.
# Checked before price / leveling rules (a hidden cheap crafting base still shows), after
# rules/top.filter (5/6 links, Awakened + 20% gems) and [overquality].
# ---------------------------------------------------------------------------
[vendor_recipes.grasping_mail]
# Grasping Mail (poewiki "Vendor recipe"): 60x any mix of these Breach rings -> rare unID
# Grasping Mail. Any rarity incl. unique; unidentified, corrupted or split fine. Formless Ring
# is not part of it (Lost Unity recipe).
enabled = true
tier = "variable"
class = "Rings"
bases = ["Cryonic Ring", "Enthalpic Ring", "Fugitive Ring", "Organic Ring", "Synaptic Ring"]
note = "60x any mix; any rarity incl. unique; unidentified, corrupted or split OK"

# Currency recipes, as in NeverSink's regular filter (low tier: white text + beam, Diamond).
[vendor_recipes.chromatic]
# Chromatic Orb: an item with R-G-B linked sockets, any size.
enabled = false
tier = "low"
rarity = ["Normal", "Magic", "Rare"]
conds = ['SocketGroup "RGB"']
note = "1 Chromatic Orb each"

[vendor_recipes.jeweller]
# 7 Jeweller's Orbs: an item with 6 sockets (5/6 links: show_5_links / show_6_links).
enabled = false
tier = "low"
rarity = ["Normal", "Magic", "Rare"]
conds = ["Sockets >= 6"]
note = "7 Jeweller's Orbs each"

[vendor_recipes.gemcutter]
# Gemcutter's Prism: gems with 40% total quality (or one 20%). 20% and Awakened gems keep
# their own rules (rules/top.filter).
enabled = true
tier = "low"
class = ["Skill Gems", "Support Gems"]
conds = ["Quality >= 1"]
note = "40% total quality -> 1 Gemcutter's Prism"

[vendor_recipes.glassblower]
# Glassblower's Bauble: white flasks with 40% total quality (NeverSink shows the 20% ones).
enabled = true
tier = "low"
rarity = ["Normal"]
class = ["Hybrid Flasks", "Life Flasks", "Mana Flasks", "Utility Flasks"]
conds = ["Quality >= 20"]
note = "40% total quality -> 1 Glassblower's Bauble"

# ---------------------------------------------------------------------------
# Content modules: uniques that only drop from one boss / encounter / instance (Breach boss,
# Trialmaster, Blight-ravaged map). Turn one on while you run that content; normal mapping
# stays the same, so it can stay on.
#   on:  its uniques are priced like any unique (a 1c one on Titan Greaves -> blue, a 5 div
#        one -> top). A base the price rules HIDE (cheap sibling unique) still shows small +
#        faded ([style.content]) when one of its content uniques is itself in a shown
#        [uniques] show tier (Amber Amulet: 1c map junk, 2 div Xoph's Blood). A cheap content
#        unique (7c Hand of the Lords) stays hidden. Base-wide: a junk map unique on a faded
#        base shows faded too (filters can't tell which unique dropped).
#   off: its uniques are ignored on shared bases (Titan Greaves = Kaom's Roots tier). A base
#        with only that content's uniques still shows blue.
# PoE filters cannot tell where an item dropped, so the rule applies everywhere.
# Per unique in `drops`: "price" (= default), true = faded show even past [overrides] when its
# price would hide the base (price tier still wins), false = always hide
# (base-wide). League start enables all content modules.
# ---------------------------------------------------------------------------
[content.breach]
# Breach bosses in map breaches, Genesis Tree / Ancient Wombgift, Hive coffers, Esh / Tul.
# Normal Breach monsters don't drop these.
enabled = true
sources = ["BreachBoss"]

[content.ultimatum]
enabled = true
sources = ["Ultimatum"]   # Trialmaster boss drops + Ultimatum rewards

[content.blight]
enabled = false
sources = ["Blight"]   # Blight encounters, including Blight-ravaged maps

[content.blight.drops]
"Breathstealer" = "price"
"Cowl of the Ceraunophile" = "price"
"Cowl of the Cryophile" = "price"
"Cowl of the Thermophile" = "price"
"Sporeguard" = "price"
"Stranglegasp" = true
"The Stampede" = "price"

[content.ultimatum.drops]
"Gamblesprint" = "price"
"Glimpse of Chaos" = true       # Vaal Mask
"Hateforge" = true
"Ixchel's Temptation" = true
"Mahuxotl's Machination" = "price"
"Relic of the Pact" = "price"
"Temptation Step" = "price"
"Yaomac's Accord" = "price"

# ---------------------------------------------------------------------------
# Foulborn uniques: priced on their own, never mixed into the normal unique tiers.
# One Foulborn unique has many mutated-mod variants (Doomsower 120c .. 263k c) and the
# filter can't see which mods dropped, only "Foulborn True" + BaseType. So per base:
#   tier     = cheapest variant of any Foulborn unique on it (Goldwyrm 3.5c -> low)
#   variable = best variant >= jackpot_divine (worth checking the mods)
#   hidden   = below min_tier (and below [small_loot] when that's on), unless some
#              variant >= uniques.never_hide_tier (then variable)
# min_listings counts all variants of one unique together (variants are thin).
# ---------------------------------------------------------------------------
[foulborn]
min_listings = 5
min_tier = "low"
# Foulborn base with no confident price: tier name, "hide" or "unknown"
unpriced = "unknown"

# ---------------------------------------------------------------------------
# Wrist saver: loot that doesn't stack (takes its own inventory slot) worth less than
# tier min_tier is hidden, to cut clicking and inventory management. Applies to uniques,
# Foulborn uniques and the poe.ninja types in `types`. Jackpots and never_hide_tier still
# show. enabled = false -> only each section's own min_tier applies.
# ---------------------------------------------------------------------------
[small_loot]
enabled = true
min_tier = "minor"
types = ["Invitation", "Wombgift"]

# ---------------------------------------------------------------------------
# Gems: a poe.ninja variant price (1, 1/20, 20/20, 21/23c ...) shows the gem in its tier only
# from min_tier up (level 1 gems list at 5-10c that nobody pays). Cheaper gems: hidden by
# rules/bottom.filter, except rules/top.filter's Awakened / 20% shows and the gemcutter
# recipe (like NeverSink, which hides plain level 1 gems). league_start: lowest tier.
# No exact price -> blue (variable): thin listings (any price), and level 21+ / quality 21+
# gems with no confident price. A confident price below min_tier still hides that variant.
# ---------------------------------------------------------------------------
[gems]
min_tier = "mid"

# ---------------------------------------------------------------------------
# Overquality items: non-mirrored, non-corrupted gear at these quality thresholds
# is shown before price-based rules. 30% matches the active NeverSink tier;
# enable 27% and 21% as desired.
# ---------------------------------------------------------------------------
[overquality]
quality_30 = true
quality_27 = false
quality_21 = false

# ---------------------------------------------------------------------------
# Normal / magic flasks + tinctures: NeverSink's rules from reference/league.filter, copied
# every build (borders / backgrounds stripped): identified magic flasks / tinctures with good
# mods ([0803]), fractured utility flasks ([1303]), endgame overquality ([[2500]]: 21%+ any
# flask, 21% / 26% ilvl 82+ utility flasks + tinctures, corrupted 30% utility). Before vendor
# recipes, so a 21% white flask shows this way instead of the glassblower style.
# Flask bases (Iron Flask ilvl 84 ...) are priced by poe.ninja in [bases], not here.
# league_start: also the flask blocks commented out in reference/league.filter.
# ---------------------------------------------------------------------------
[flasks]
enabled = true

# ---------------------------------------------------------------------------
# Memory-stranded + fractured gear: reference/league.filter's blocks with its own style
# (borders / backgrounds stripped): [0902] memory strands (stranded + fractured / veiled,
# top bases 60+ / 15+ strands), [[1100]] fractured + veiled / incursion / delve mods,
# [1303] fractured jewels / abyss jewels / heist gear (fractured flasks: [flasks]).
# league_start: also the blocks commented out there (lower strand tiers, any fractured item).
# Before vendor recipes / crafting bases / rares. poe.ninja has no price for these.
# ---------------------------------------------------------------------------
[exotics]
enabled = true

# ---------------------------------------------------------------------------
# Maps: shown / hidden exactly as reference/league.filter, with its own style. Special maps
# always: Valdo, Nightmare, Shaper guardian, Zana / Elder (T16) / conqueror influenced,
# blighted + blight-ravaged, T16 Vaal Temple, enchanted, implicit, 8-mod corrupted
# ([0301], [3202]-[3204]). Unique maps: [uniques] hide_maps.
# progression = normal maps by tier ([3302]):
#   "none" = league.filter as is: every tier hidden (late league)
#   "all"  = every tier shown, league.filter tier style (league start: turning the rules on)
#   "auto" = a tier shows while AreaLevel <= its own level (campaign: all; in a T5 map: T5+;
#            in a T16 map: T16 only). Middle ground while climbing the atlas.
# league_start: "none" -> "all", plus league.filter's commented-out map rules (corrupted implicit).
# ---------------------------------------------------------------------------
[maps]
progression = "none"

# ---------------------------------------------------------------------------
# Campaign / leveling: NeverSink's leveling rules, taken from reference/league.filter
# (sections [2802] jewels, [[5000]]-[[5400]] flasks + gear) every build. Campaign currency:
# price tiers / NeverSink reference tiers, never hidden (show_all_stackables).
# Every block gets "AreaLevel <= area_level_max" (and "Rarity <= Rare" on gear), so they
# do nothing in maps and never touch uniques. Placed right after rules/top.filter.
# strictness = NeverSink levels: 0 soft (everything), 1 regular, 2 semi-strict,
#              3 strict (+ hides large magic items), 4 very strict
# build = build module rules/leveling/<build>.filter, checked first ("" = none).
#         New build: copy rf.filter, edit, set the name here.
# hide_normal_after: last area level where white (normal) gear shows. With a build: only the
#         types in its "Show # whites" block, other white gear is always hidden. No build: all
#         white gear. Flasks not included. Other build module Shows still win (rf: Iron Ring, 4-links).
# hide_magic_after: last area level where magic (blue) gear shows, same classes as white
#         (flasks / tinctures stay, jewellery stays with show_jewellery). Vendor items enabled
#         by show_magic_vendor still show; this hide beats the build module. Leave out = off.
# keep_build_weapons_magic: true = magic weapons the build module Shows (rf: 2H axes / maces
#         until the RF swap) still show after hide_magic_after. false = hidden too.
# show_jewellery: amulets, rings, belts of any rarity (white too) always shown in the
#         campaign, before the build module (its Hides don't apply to them).
# show_gems: all skill + support gems shown in the campaign (maps: only the bottom.filter gem rules).
# show_magic_vendor / show_rare_vendor: independently show magic / rare vendor items in the
#         campaign, before hide_magic_after and the build module (their Hides don't apply).
# show_magic_rare_cells: maximum inventory cells for those items, measured per base with its
#         Width x Height (for example, small shields show while 2x4 shields do not at 4). 0 = off.
# league_start_hide_unused: with league_start, white crafting bases in maps that the build
#         module hides (rf: pure ES, unused weapons, jewels, ...) stay hidden, unless worth
#         bases.min_tier. Other white bases show at league start.
# show_all_stackables: in the campaign no currency / card / fragment / ... is hidden.
#         Price tier styles stay; what maps would hide shows in the lowest tier's style.
# ---------------------------------------------------------------------------
[leveling]
enabled = true
strictness = 2
area_level_max = 67
build = "rf"
hide_normal_after = 2
hide_magic_after = 7
keep_build_weapons_magic = true
show_jewellery = true
show_gems = true
show_magic_vendor = true
show_rare_vendor = true
show_magic_rare_cells = 4
league_start_hide_unused = true
show_all_stackables = true
# Campaign blocks with a minimap icon but no sound get this (Orb of Chance etc. = NeverSink single chaos sound; 4 = maps only)
icon_sound = "PlayAlertSound 2 300"

# out/report.html: "Hidden, worth a look" lists hidden items priced >= this tier
[report]
review_tier = "mid"

# ---------------------------------------------------------------------------
# Crafting bases (normal/magic/rare, ilvl 82+, optionally influenced) priced
# from poe.ninja. These prices are noisy, so confidence filters are strict.
# ---------------------------------------------------------------------------
[bases]
enabled = true
min_tier = "top"       # only show bases worth at least this tier
min_listings = 10
min_samples = 10
include_dual_influence = false

# ---------------------------------------------------------------------------
# Manual overrides by exact BaseType. Win over prices.
# Divine Orb, Mirror of Kalandra, and Hinekora's Lock are pinned to top/tink and cannot be overridden.
# ---------------------------------------------------------------------------
[overrides]
# name = tier name | "hide" | "variable" | "unknown"
"Scroll of Wisdom" = "hide"
"Portal Scroll" = "hide"

# Uniques with a corrupted implicit (CorruptedMods >= 1): shown even when their base
# is priced below min_tier. Listed classes OR base types match. Change per league.
# Better tiers (e.g. a tink base) keep their own style; this only rescues hidden ones.
# Old filter list: Daggers, Rune Daggers, Wands, Boots, Gloves, Helmets, Shields,
#                  Amulets, Belts, Quivers, Rings, Jewels
[corrupted_implicits]
style = "variable"   # tier style to use
classes = ["Daggers", "Rune Daggers", "Wands", "Boots", "Gloves", "Helmets", "Shields",
           "Amulets", "Belts", "Quivers", "Rings", "Jewels"]
bases = []           # exact BaseType, e.g. "Prismatic Jewel"

# Unique bases you always want at a tier regardless of price
[unique_overrides]
# "Heavy Belt" = "variable"

# ---------------------------------------------------------------------------
# Styles. Raw filter lines. Taken from your FilterBlade filter.
# Visible item text uses maximum font size 45, except explicit content-module show overrides.
# Minimap icons: size 1 (medium) everywhere, colour = text colour. Only tink gets size 0 (big).
# Icon SHAPE is set by build_filter.py per category (shape in styles below is replaced):
#   Star = uniques + tink, Square = unique maps, Circle = currency-like stackables/cards,
#   Hexagon = fragments/scarabs, Kite = splinters (name contains "Splinter"), Diamond = bases / recipes / unknown,
#   Moon = league-specific stackables without a more fitting category.
# Rule: no SetBorderColor / SetBackgroundColor except top (tink). Borders are
# cleared for everything by a default block, so only add them on purpose.
#   top     = TINK. Only for items KNOWN to be >= 1 div. White bg, red text, tink sound.
#   high    = red text, >= 1/4 div
#   mid     = yellow text, >= 1/16 div
#   minor   = grey text, >= 1/64 div
#   low     = grey text, >= 1/256 div (late league: quiet_tiers -> brown)
#   brown   = brown text, >= 1/1024 div   dust = brown text, everything cheaper
#   variable/unknown = blue beam, game's own text colour: value unknown or variable,
#                      worth picking up / identifying
# ---------------------------------------------------------------------------
[style.top]
lines = [
  "SetFontSize 45",
  "SetTextColor 255 0 0 255",
  "SetBorderColor 255 0 0 255",
  "SetBackgroundColor 255 255 255 255",
  "PlayAlertSound 6 300",
  "PlayEffect Red",
  "MinimapIcon 0 Red Star",
]

[style.high]
lines = [
  "SetFontSize 45",
  "SetTextColor 255 0 0 255",
  "PlayAlertSound 1 300",
  "PlayEffect Red",
  "MinimapIcon 1 Red Circle",
]

[style.mid]
lines = [
  "SetFontSize 45",
  "SetTextColor 255 190 0",
  "PlayAlertSound 2 300",
  "PlayEffect Yellow",
  "MinimapIcon 1 Yellow Circle",
]

[style.minor]
lines = [
  "SetFontSize 45",
  "SetTextColor 215 215 215 255",
  "PlayAlertSound 2 300",
  "PlayEffect White",
  "MinimapIcon 1 White Circle",
]

[style.low]
lines = [
  "SetFontSize 45",
  "SetTextColor 215 215 215 255",
  "PlayAlertSound 2 300",
  "PlayEffect White",
  "MinimapIcon 1 White Circle",
]

# Used instead of a tier's own style when the tier is in quiet_tiers.
# SetFontSize comes from the tier itself.
[style.quiet]
lines = [
  "SetTextColor 210 178 134 255",
  "PlayEffect Grey",
  "MinimapIcon 2 Grey Circle",
  "DisableDropSound True",
]

# Below 1/256 div: brown text, no beam/icon/sound
[style.brown]
lines = [
  "SetFontSize 45",
  "SetTextColor 210 178 134 255",
  "DisableDropSound True",
]

# Content modules: small, no beam / icon / sound; keep unique text colour and soften label
[style.content]
lines = [
  "SetFontSize 32",
  "SetBackgroundColor 0 0 0 193",
  "DisableDropSound True",
]

[style.dust]
lines = [
  "SetFontSize 45",
  "SetTextColor 210 178 134 255",
  "DisableDropSound True",
]

[style.variable]
lines = [
  "SetFontSize 45",
  "PlayAlertSound 2 300",
  "PlayEffect Blue",
  "MinimapIcon 1 Blue Star",
]

[style.unknown]
lines = [
  "SetFontSize 45",
  "SetTextColor 215 215 215 255",
  "PlayAlertSound 2 300",
  "PlayEffect Blue",
  "MinimapIcon 1 Blue Star",
]
