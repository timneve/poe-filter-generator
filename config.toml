[exchange.reference_card_tiers]
# Source: fallback_tiers.toml [cards] (regular NeverSink card groups). Left side is a rough
# NeverSink ranking by expected value/interest, highest to lowest:
#   t1   - highest-value chase cards
#   t2   - very valuable cards, below t1
#   t3   - valuable/mid-ranked cards
#   t4c  - lower-ranked currency-reward cards
#   t4   - lower-ranked general cards
#   t5c  - very low-ranked currency-reward cards
#   t5   - lowest-ranked general cards (hidden in the regular reference filter)
#   tnew - new/experimental group; commented out in the reference, so usually no cards
#
# These are NOT drop-rate rarity classes, exact prices, or price bands; the reference gives
# no chaos/divine values. Right side selects this filter's visual/visibility tier:
#   top = tink (normally >= 1 div); high = red (>= 1/4 div); mid = yellow (>= 1/16 div);
#   low = quiet (>= 1c); hide = hidden; unknown = blue.
# Those thresholds describe the styles for actually priced items. A fallback card has NO
# such price: e.g. t3 -> mid makes it yellow, but does NOT mean it is worth 1/16 div. This
# mapping only borrows the presentation and is used only when there is no reliable price AND
# exchange volume is below card_fallback_min_volume. Cards with enough activity but no
# reliable buy-side price stay blue/unknown instead.
t1 = "top"
t2 = "high"
t3 = "mid"
tnew = "unknown"
t4c = "hide"
t4 = "hide"
t5c = "hide"
t5 = "hide"

# ---------------------------------------------------------------------------
# Uniques, [uniques.ev] on (default): a base is tiered by the EXPECTED VALUE of one
# unidentified drop = drop chance of each unique on it x its price. Tier off in show: hidden,
# jackpots too (Leather Belt: Headhunter ~1 in 3900 unique Leather Belts -> ~1.4c per belt).
# Shown, but its cheapest unique's tier is off: blue "variable" (Heavy Belt: Mageblood
# ~1 in 3400, ~8c per belt). always_show_bases: shown no matter what.
# Bases without drop-anywhere uniques (league content only) and [uniques.ev] off use the
# rules below. Bases whose enabled uniques are all boss/encounter-only are always shown as
# variable, unless enabled in a [content.*] module where poe.ninja pricing applies.
#
# Uniques: a base is tiered by its CHEAPEST unique (base_price = "lowest"). Heavy Belt with
# 1c Belt of the Deceiver = 1c tier, no matter what else rolls on it. base_price = "highest":
# tiered by its priciest confident unique instead (shows more, clicks more junk).
# Exception: variable bases (cheap, but some unique on it >= top-level jackpot_divine, e.g.
# Heavy Belt -> Mageblood) get the blue "variable, worth identifying" style. A base whose
# cheapest is already top / high / mid keeps that tier (louder than blue).
# Safety: a base is NEVER hidden if any unique on it (any listing count) is worth
# >= never_hide_tier (tier name, default top = 1 div); it goes variable instead
# (Leather Belt -> Headhunter).
# ---------------------------------------------------------------------------
[uniques]
# Unique tier toggles: false = unique bases priced in that tier are hidden (variable /
# jackpot / always_show_bases still shown). [small_loot] on still hides below its min_tier.
# league_start turns them all on.
show.top   = true
show.high  = true
show.mid   = true
show.minor = false
show.low   = false
show.brown = false
show.dust  = false
never_hide_tier = "top"
# Without EV ([uniques.ev] off, or bases with no drop-anywhere uniques): base tier from its
# "lowest" or "highest" confident unique price. Jackpot / never_hide_tier rescue apply either way.
base_price = "lowest"
# Late league wrist saver: true = never_hide_tier rescue off, a cheap base goes blue
# "variable" only when some unique on it is >= jackpot_divine (Moonstone Ring: 1c Heartbound
# Loop / Timeclasp mostly, 200c Anathema -> hidden). Foulborn too. league_start forces false.
variable_jackpot_only = true
# Unique item classes always blue "variable", whatever their price tier (normal + Foulborn);
# only a base priced top (every unique on it >= 1 div) keeps its tink. [] = off.
variable_classes = ["Jewels", "Abyss Jewels"]
# Listings a poe.ninja price needs (uniques, listing-priced stackables, cluster jewels, gems)
min_listings = 10
include_replicas = false
# Base with no priced uniques (new / unknown): tier name, "hide" or "unknown"
unpriced = "unknown"
# Unique maps as reference/league.filter [3201]: corrupted ones shown (blue star), the rest
# hidden, before any price rule. false = price unique maps like other uniques (Square icon).
hide_maps = true
# Hand list: unique bases always shown (blue "variable" when their EV would hide them).
# Start: NeverSink "High Variety - Top Multi-Bases" ($tier->multispecialhigh, regular filter).

# Late league
always_show_bases = [
  "Heavy Belt"
]

# always_show_bases = [
#   "Cloth Belt", "Elegant Round Shield", "Heavy Belt", "Hellion's Paw", "Hypnotic Eye Jewel",
#   "Imperial Bow", "Imperial Skean", "Imperial Staff", "Leather Belt", "Magistrate Crown",
#   "Paua Amulet", "Searching Eye Jewel", "Small Cluster Jewel", "Spine Bow", "Topaz Flask",
#   "Vaal Blade", "Vaal Claw",
# ]

# Uniques that can't drop in a normal endgame map (pinnacle/uber bosses, Breachlords, Atziri,
# Syndicate, Delve, Heist + all Replicas, Incursion temple, Lab, vendor recipes, upgrades,
# no longer drops) are left out of unique pricing, so Cane of Kulemak doesn't make
# Serpentine Staff (Sire of Shards 1c) blue. Boss loot: toggle the filter off in game.
# Source: poewiki "drop restricted" flag + drop source (cache/wiki_uniques.json, weekly).
skip_non_map_drops = true
wiki_cache_days = 7
# A drop-restricted unique still counts if its wiki drop source contains any of these
# (case-insensitive): map content where it can drop.
map_sources = [
  "Map Boss", "Rare enem", "Ritual", "Ultimatum", "Runic monsters", "mercenary",
  "AbyssTwoLeague", "ReligiousTemplar", "LeagueAzmeri", "LeagueBestiary", "LegionLeague",
  "LeagueAffliction", "AfflictionTown", "MavenHub", "Monsters/Wb", "DemonBosses",
  "LunarisSolaris", "Statue", "UnholyTrio", "Viking",
]

# Expected value per unique base. A unique drop picks a tier by tier_weights, then any
# drop-anywhere unique in that tier evenly, so one unique's chance = its tier weight /
# uniques in its tier. Tiers: unique_tiers.toml (poewiki). A unique's price = average of its
# poe.ninja variants weighted by listings (Mageblood 2-4 flasks). Unlisted = worth 0, but an
# unlisted unique of tier <= unknown_chase_tier makes the base blue (unknown_as_variable).
[uniques.ev]
enabled = true
# % per tier, poewiki pre-3.19 RegularValue estimate (natural drops). T0 is the shakiest number.
tier_weights = { "0" = 0.005, "1" = 0.036, "2" = 0.8, "3" = 10.9, "4" = 34.0, "5" = 54.3 }
default_tier = 3   # drop-anywhere unique missing from unique_tiers.toml
unknown_chase_tier = 2

# Fix the wiki guess per unique name: true = drops in maps (count it), false = skip it
[uniques.map_drop]
# "Dread Captain's Cutlass" = true
"Angler's Plait" = false   # only drops with a Corrupted Slitherpinch equipped

# ---------------------------------------------------------------------------
# Vendor recipes: show the ingredients of a recipe you do, Diamond minimap icon (like crafting
# bases), styled as `tier`. The tier is a FLOOR: an ingredient whose own price tier is better
# keeps that (a 2 div unique Fugitive Ring stays a tink, a pricey ilvl 86 crafting base or an
# [overrides] base keeps its tier, a blue variable base stays blue); a cheaper or hidden one
# gets the recipe tier. tier = a price tier, "variable" (blue: beats every price tier except
# top, so a tink stays a tink) or "price" (smart: the tier of what one ingredient vendors for,
# below). enabled = false -> recipe off.
# tier = "price": value = poe.ninja price of `reward` x `reward_count` (a value in a hidden tier
#   -> lowest shown tier: price only sets how loud, an enabled recipe shows every ingredient its
#   `conds` accept, so the lower threshold wins; reward unpriced -> its NeverSink tier, else blue).
#   `per_quality` (0 = off): reward per this much total quality, so a 10% gem = 10/40 prism;
#   one Quality >= N level per tier (better quality, better tier). `full_quality` (0 = off): one
#   item at this quality alone gives the full reward (a single 20% gem = 1 prism).
# Ingredients, one of:
#   bases = exact BaseTypes, any rarity (normal, magic, rare, unique), optional `class`
#   conds = filter conditions, all required (no bases = any base), optional `class` (one or a
#           list) and `rarity` (list; left out = any). Uniques are left to their own rules.
# Optional `sizes` (small / medium / large inventory size, [] = any) and `area_level` ([min, max],
# [] = any): see chromatic.
# Optional `any` = filter conditions, the item needs one of them (one block each, e.g.
# ["Corrupted True"]); left out = any state.
# Unique vendor value instead (no blocks, no `tier`): `uniques` = unique names, `reward` =
# stackable they vendor for, `reward_count`. Each of them is worth at least reward price x
# count in unique pricing ([uniques.ev] EV, cheapest, jackpot checks); unlisted ones too.
# Checked before price / leveling rules (a hidden cheap crafting base still shows), after
# rules/top.filter (5/6 links, Awakened + 20% gems) and [overquality].
# ---------------------------------------------------------------------------
[vendor_recipes.grasping_mail]
# Grasping Mail (poewiki "Vendor recipe"): 60x any mix of these Breach rings -> rare unID
# Grasping Mail. Any rarity incl. unique; unidentified, corrupted or split fine. Formless Ring
# is not part of it (Lost Unity recipe).
enabled = true
tier = "variable"
class = "Rings"
bases = ["Cryonic Ring", "Enthalpic Ring", "Fugitive Ring", "Organic Ring", "Synaptic Ring"]
note = "60x any mix; any rarity incl. unique; unidentified, corrupted or split OK"

[vendor_recipes.harbinger]
# Harbinger uniques vendor for a Fracturing Shard (poedb "Unique Item Recipe": 1x Harbinger
# unique; not the item pieces / The Beachhead). Shard = Fracturing Orb / 20 ([exchange.splinters]).
# Drop-restricted ones (Harbinger-only drops) still stay out of unique pricing.
enabled = true
uniques = [
  "The Enmity Divine", "The Flow Untethered", "The Fracturing Spinner", "The Rippling Thoughts",
  "The Tempest's Binding", "The Unshattered Will",
  "The Immortal Will", "The Shattered Divinity", "The Surging Thoughts", "The Tempest's Liberation",
  "The Torrent's Reclamation", "The Yielding Mortality",
]
reward = "Fracturing Shard"
reward_count = 1
note = "sell to vendor -> 1 Fracturing Shard"

# Currency recipes, as in NeverSink's regular filter, but tier = "price": shown as loud as the
# currency they make is worth now (Diamond icon), at least the lowest shown tier.
[vendor_recipes.chromatic]
# Chromatic Orb: an item with R-G-B linked sockets, any size.
enabled = false
tier = "price"
reward = "Chromatic Orb"
reward_count = 1
per_quality = 0
full_quality = 0
rarity = ["Normal", "Magic", "Rare"]
conds = ['SocketGroup "RGB"']
# FilterBlade's RGB options ([1401] / [2601]): sizes = any of "small" (2x2, 1x1-1x4), "medium"
# (2x3), "large" (2x4); [] = any size. area_level = [min, max] ([68, 83] = FilterBlade's
# endgame RGB rules); [] = anywhere.
sizes = []
area_level = []
